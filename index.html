<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Areja Lakonchai — UGC Creator, Beauty & Skincare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EF;
    --card:#F3EBDF;
    --ink:#232B22;
    --forest:#34412F;
    --sage:#7C8B6F;
    --clay:#C98671;
    --clay-deep:#8C4A38;
    --line:rgba(35,43,34,0.16);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:960px;margin:0 auto;padding:0 28px;}
  .label{
    font-family:'Space Mono',monospace;
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-size:11.5px;
    color:var(--sage);
  }
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;margin:0;color:var(--forest);}
  a{color:var(--clay-deep);}

/* name banner */
  .name-banner{position:relative;height:380px;overflow:hidden;}
  .banner-photos{position:absolute;inset:0;display:flex;}
  .banner-photo{flex:1;background-size:cover;background-position:center 15%;filter:saturate(0.85) sepia(0.05) brightness(0.96);}
  .banner-overlay{position:absolute;inset:0;background:linear-gradient(125deg, rgba(35,43,34,0.6), rgba(140,74,56,0.38));}
  .banner-fade{position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(to bottom, transparent, var(--paper));}
  .banner-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .banner-content .label{color:#F3EBDF;opacity:0.9;margin-bottom:14px;}
  .banner-name{font-family:'Fraunces',serif;font-weight:500;font-size:62px;color:var(--paper);text-shadow:0 2px 24px rgba(0,0,0,0.4);}



  
  /* nav */
  nav{
    background:rgba(251,246,239,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  nav .wrap{display:flex;align-items:center;justify-content:center;padding-top:16px;padding-bottom:16px;}
  .nav-links{display:flex;gap:26px;list-style:none;margin:0;padding:0;}
  .nav-links a{
    font-family:'Space Mono',monospace;
    font-size:11.5px;text-transform:uppercase;letter-spacing:0.1em;
    text-decoration:none;color:var(--ink);opacity:0.75;
  }
  .nav-links a:hover{opacity:1;color:var(--clay-deep);}

  /* hero */
  header.hero{padding:88px 0 72px;position:relative;overflow:hidden;}
  .hero-flex{display:flex;align-items:center;gap:48px;}
  .hero-text{flex:1 1 480px;min-width:0;}
  .hero-photo-wrap{flex:1 1 320px;min-width:260px;height:440px;position:relative;}
  .hero-photo{
    position:absolute;inset:0;border-radius:4px;
    background:url('Images/profile.jpg') center 18%/cover no-repeat;
    -webkit-mask-image:linear-gradient(100deg, transparent 0%, black 30%, black 100%);
    mask-image:linear-gradient(100deg, transparent 0%, black 30%, black 100%);
    filter:saturate(0.9) sepia(0.08) brightness(1.02);
  }
  .hero-photo::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(160deg, rgba(124,139,111,0.24), rgba(201,134,113,0.16));
    mix-blend-mode:multiply;
  }
  .hero .label{margin-bottom:18px;}
  .hero h1{font-size:48px;line-height:1.1;}
  .hero h1 em{font-style:italic;color:var(--clay-deep);}
  .hero p.tagline{max-width:460px;margin-top:20px;font-size:16.5px;color:#4b5347;}
  .badge-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px;}
  .badge{
    font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.06em;
    text-transform:uppercase;border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;color:var(--forest);
  }
  .cta-row{margin-top:36px;display:flex;gap:14px;flex-wrap:wrap;}
  .btn{
    display:inline-block;font-family:'Space Mono',monospace;font-size:12.5px;
    text-transform:uppercase;letter-spacing:0.08em;text-decoration:none;
    padding:14px 26px;border-radius:2px;
  }
  .btn-solid{background:var(--forest);color:var(--paper);}
  .btn-outline{border:1px solid var(--forest);color:var(--forest);}

  section{padding:64px 0;border-top:1px solid var(--line);}
  .section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:36px;flex-wrap:wrap;gap:10px;}
  .section-head h2{font-size:30px;}

  /* about */
  .about-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:start;}
  .about-grid p{color:#4b5347;font-size:15.5px;max-width:440px;}
  .ingredients{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);}
  .ingredients li{
    display:flex;justify-content:space-between;padding:14px 0;
    border-bottom:1px solid var(--line);font-size:14.5px;
  }
  .ingredients li span:first-child{font-weight:500;}
  .ingredients li span:last-child{color:var(--sage);font-family:'Space Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.06em;}

  /* content library */
